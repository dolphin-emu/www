{% extends "zinnia/tags/search_form.html" %}
{% load i18n zinnia %}

{% block search_filters %}
    {{ block.super }}
    {% if search_domain and search_domain == DEFAULT_HOST %}
    <input type="hidden" name="as_q" value="-site:*.{{ search_domain }}" />
    {% endif %}
{% endblock %}

{% block search_fields %}
    <div class="input-group">
        <input type="text" name="q" placeholder="{% trans "Search articles" %}" class="form-control" required />
        <span class="input-group-btn">
            <button type="submit" class="btn">
                <i class="icon-search"></i>
            </button>
        </span>
    </div>
{% endblock %}
